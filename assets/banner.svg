<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Glowing Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-14px) rotate(1.5deg); }
    }
    @keyframes floatFast {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(-1.5deg); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.08); }
    }
    @keyframes dashCycle {
      to { stroke-dashoffset: -40; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .bg-canvas { fill: url(#bgGrad); }
    .pulse-orb1 { animation: pulseGlow 7s ease-in-out infinite; transform-origin: 200px 100px; }
    .pulse-orb2 { animation: pulseGlow 9s ease-in-out infinite 2s; transform-origin: 1000px 300px; }
    .floating-card-left { animation: floatSlow 8s ease-in-out infinite; transform-origin: center; }
    .floating-card-right { animation: floatFast 7s ease-in-out infinite 1s; transform-origin: center; }
    .pill-dynamic-1 { animation: floatPill 5s ease-in-out infinite 0.5s; }
    .pill-dynamic-2 { animation: floatPill 6s ease-in-out infinite 1.5s; }
    .flow-line { stroke-dasharray: 6 6; animation: dashCycle 2.5s linear infinite; }
    .font-main { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="20" class="bg-canvas" />

  <!-- Ambient Glowing Orbs in Background (behind everything) -->
  <circle cx="180" cy="90" r="140" fill="#38bdf8" opacity="0.25" filter="url(#glow)" class="pulse-orb1" />
  <circle cx="1020" cy="310" r="160" fill="#a855f7" opacity="0.22" filter="url(#glow)" class="pulse-orb2" />
  <circle cx="600" cy="400" r="180" fill="#3b82f6" opacity="0.15" filter="url(#glow)" />

  <!-- Decorative Matrix / Grid Lines -->
  <g stroke="#334155" stroke-opacity="0.3" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="420" />
    <line x1="1120" y1="0" x2="1120" y2="420" />
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="350" x2="1200" y2="350" />
  </g>

  <!-- Dynamic Background Element: Visual Builder Canvas Elements (Left Side Floating Card) -->
  <g class="floating-card-left" opacity="0.88">
    <g transform="translate(60, 110)">
      <rect width="210" height="150" rx="14" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
      <rect x="18" y="18" width="55" height="10" rx="5" fill="#38bdf8" opacity="0.8" />
      <rect x="18" y="38" width="130" height="8" rx="4" fill="#94a3b8" opacity="0.5" />
      <rect x="18" y="54" width="95" height="8" rx="4" fill="#94a3b8" opacity="0.35" />
      
      <!-- Component Drag Block Simulation -->
      <rect x="18" y="76" width="174" height="42" rx="8" fill="#1e293b" stroke="#818cf8" stroke-dasharray="3 3" stroke-width="1.2" />
      <circle cx="36" cy="97" r="9" fill="#818cf8" opacity="0.3" />
      <rect x="54" y="93" width="70" height="8" rx="4" fill="#cbd5e1" opacity="0.8" />
      <rect x="150" y="90" width="30" height="14" rx="4" fill="#38bdf8" opacity="0.3" />

      <!-- Cursor Pointer -->
      <path d="M 148 100 L 160 120 L 153 121 L 158 132 L 152 135 L 147 124 L 141 128 Z" fill="#38bdf8" filter="url(#subtleGlow)" />
    </g>
  </g>

  <!-- Connecting Flow Line between builder nodes -->
  <path d="M 270 190 C 330 190, 310 90, 390 90" fill="none" stroke="#6366f1" stroke-width="2" class="flow-line" opacity="0.6" />

  <!-- Dynamic Background Element: Visual Tree / Blocks Hierarchy (Right Side Floating Card) -->
  <g class="floating-card-right" opacity="0.88">
    <g transform="translate(930, 115)">
      <rect width="210" height="155" rx="14" fill="url(#cardGrad1)" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1.5" />
      <!-- Inspector Header -->
      <circle cx="24" cy="22" r="5" fill="#ef4444" opacity="0.8" />
      <circle cx="38" cy="22" r="5" fill="#eab308" opacity="0.8" />
      <circle cx="52" cy="22" r="5" fill="#22c55e" opacity="0.8" />
      
      <!-- Layer Tree Items -->
      <rect x="18" y="42" width="174" height="24" rx="6" fill="#334155" opacity="0.5" />
      <text x="32" y="58" class="font-main" font-size="11" fill="#c084fc" font-weight="600">⚡ &lt;Section / Hero&gt;</text>
      
      <rect x="28" y="72" width="164" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
      <text x="42" y="88" class="font-main" font-size="11" fill="#93c5fd">📦 Container [Flex]</text>
      
      <rect x="38" y="102" width="154" height="24" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="0.8" />
      <text x="52" y="118" class="font-main" font-size="11" fill="#f472b6">✨ Call-to-Action</text>
    </g>
  </g>

  <path d="M 930 195 C 870 195, 880 320, 800 320" fill="none" stroke="#ec4899" stroke-width="2" class="flow-line" opacity="0.6" />

  <!-- Dynamic Feature Badges / Floating Pills -->
  <g class="pill-dynamic-1" transform="translate(190, 310)">
    <rect width="165" height="34" rx="17" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
    <text x="82" y="22" text-anchor="middle" class="font-main" font-size="12" fill="#7dd3fc" font-weight="600">⚡ Visual Drag &amp; Drop</text>
  </g>

  <g class="pill-dynamic-2" transform="translate(845, 60)">
    <rect width="160" height="34" rx="17" fill="#0f172a" stroke="#c084fc" stroke-width="1.2" opacity="0.9" />
    <text x="80" y="22" text-anchor="middle" class="font-main" font-size="12" fill="#e9d5ff" font-weight="600">🎨 Zero-Code Canvas</text>
  </g>

  <!-- ================= FOREGROUND HERO CONTENT (Unobscured & Clear) ================= -->

  <!-- Top Pill / Category Tag -->
  <g transform="translate(600, 80)">
    <rect x="-145" y="-16" width="290" height="32" rx="16" fill="#1e293b" stroke="#6366f1" stroke-width="1.2" />
    <text x="0" y="5" text-anchor="middle" class="font-main" font-size="12.5" fill="#a5b4fc" font-weight="700" letter-spacing="1.5">
      🚀 AWESOME CURATED ECOSYSTEM
    </text>
  </g>

  <!-- Primary Main Title (Crisp Gradient, Forefront) -->
  <text x="600" y="155" text-anchor="middle" class="font-main" font-size="46" font-weight="900" fill="url(#textGrad)" letter-spacing="-0.5">
    No-Code Website Builders
  </text>

  <!-- Secondary Subtitle -->
  <text x="600" y="200" text-anchor="middle" class="font-main" font-size="20" font-weight="600" fill="#f8fafc" letter-spacing="0.2">
    The Ultimate Landscape for Visual Page Designers &amp; Self-Hosted Engines
  </text>

  <!-- Supporting Subtitle / Highlights -->
  <text x="600" y="235" text-anchor="middle" class="font-main" font-size="14.5" fill="#94a3b8">
    Commercial SaaS Titans • Open-Source Powerhouses • Real-Time WYSIWYG
  </text>

  <!-- Feature Highlights Row -->
  <g transform="translate(600, 290)">
    <!-- SaaS Leaders Pill -->
    <g transform="translate(-230, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" class="font-main" font-size="12" fill="#c7d2fe" font-weight="600">🏢 Enterprise SaaS</text>
    </g>

    <!-- Open Source Pill -->
    <g transform="translate(0, 0)">
      <rect x="-95" y="-18" width="190" height="36" rx="18" fill="#064e3b" stroke="#34d399" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" class="font-main" font-size="12" fill="#6ee7b7" font-weight="600">🔓 Open-Source &amp; Free</text>
    </g>

    <!-- Headless & AI Pill -->
    <g transform="translate(230, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#4c0519" stroke="#fb7185" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" class="font-main" font-size="12" fill="#fecdd3" font-weight="600">🤖 AI &amp; Headless CMS</text>
    </g>
  </g>

  <!-- Bottom Accent Status Bar -->
  <g transform="translate(600, 375)">
    <text x="0" y="0" text-anchor="middle" class="font-main" font-size="12" fill="#64748b" font-weight="500">
      Continuously Updated • Transparent Pricing &amp; Limits • Star-Sorted Open-Source Repositories
    </text>
  </g>

</svg>
